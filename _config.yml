# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: 冬风 · winterwind
subtitle: 'Infinity'
description: ''
keywords:
author: 冬风
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## 与原站保持一致（原站 og:url 为 http://whitecatj.github.io/index.html）
url: http://whitecatj.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
## admin 后台是纯静态单页，原样复制到 public/admin/，不要被渲染器处理
skip_render:
  - 'admin/**'

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

# 与原站一致：Pygments 风格 <figure class="highlight"> + 行号
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''


# Home page setting
index_generator:
  path: ''
  per_page: 10 # 原站 16 篇文章分 2 页
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: winterwind

# Deployment
## 若本机可直连 GitHub，执行 `hexo g -d` 即可发布
## 若不能（例如在 WorkBuddy 沙箱里），改用 tools/publish.py
deploy:
  type: git
  repo: https://github.com/whitecatj/whitecatj.github.io.git
  branch: master
  message: 'Site updated: {{ now("YYYY-MM-DD HH:mm:ss") }}'
