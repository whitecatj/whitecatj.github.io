name: Build and Deploy Blog

# 只要 main 分支上的文章/配置有改动，就自动重新编译并发布
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          # 构建机默认 UTC，会让无时区写法的文章日期整体偏移一天，必须锁定为 +08:00
          TZ: Asia/Shanghai

      - name: Deploy to master branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: master
          publish_dir: ./public
          user_name: Winterwindww
          user_email: 58222279+Winterwindww@users.noreply.github.com
          commit_message: 'Site updated from main branch'
